<!-- Un commentaire pour tester rsync -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A colorful pause inspired by the beauty of butterflies.">
  <title>Nature in Flight</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="hero" id="top">
    <nav class="navigation" aria-label="Main navigation">
      <a class="logo" href="#top">Nature<span>.</span></a>
    </nav>

    <section class="hero-content">
      <p class="eyebrow">A nature journal</p>
      <h1>Beauty<br>takes flight.</h1>
      <p class="intro">
        An invitation to slow down, notice the colors, and find poetry
        in the small moments around us.
      </p>
      <button class="button" type="button" id="open-image">Step into the image <span aria-hidden="true">→</span></button>
    </section>

    <footer class="footer">
      <span>A story of light</span>
    </footer>
  </main>

  <dialog class="image-dialog" id="image-dialog" aria-labelledby="image-title">
    <div class="image-dialog-content">
      <button class="close-button" type="button" id="close-image" aria-label="Close image">&times;</button>
      <img src="assets/images/papillons-au-coucher-du-soleil.jpg" alt="Two colorful butterflies glowing in warm sunlight">
      <div class="image-caption">
        <p class="eyebrow">A winged pause</p>
        <h2 id="image-title">They <span>take</span> flight.<br>They <span>carry</span> light.</h2>
        <p>One flutter, two wings, and a little sunshine caught in the middle.</p>
      </div>
    </div>
  </dialog>

  <script src="assets/js/main.js"></script>
</body>
</html>
